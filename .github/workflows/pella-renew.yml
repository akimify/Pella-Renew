def run():
    print(f"🚀 Pella.app Discord服务器续期脚本启动")
    print(f"🕐 {now_str()}")

    with SB(uc=True, test=True, proxy=LOCAL_PROXY) as sb:

        # ── 步骤1：登录 pella.app ────────────────────────────
        print("\n── 步骤1：登录 pella.app ──")
        sb.uc_open_with_reconnect("https://www.pella.app/login", reconnect_time=4)
        time.sleep(2)

        print(f"✏️ 输入邮箱...")
        sb.wait_for_element_visible("#identifier-field", timeout=20)
        sb.type("#identifier-field", EMAIL)
        time.sleep(0.5)

        print("🖱️ 点击 Continue（邮箱确认）")
        sb.click("button[data-localization-key='formButtonPrimary']")
        time.sleep(2)

        print("✏️ 输入密码：******")
        sb.wait_for_element_visible("#password-field", timeout=20)
        sb.type("#password-field", PASSWORD)
        time.sleep(0.5)

        print("🖱️ 点击 Continue（密码确认）")
        sb.click("button[data-localization-key='formButtonPrimary']")

        print("⏳ 等待跳转到 home...")
        for _ in range(40):
            if "/home" in sb.get_current_url():
                print("✅ 登录成功，已进入 home 页")
                break
            time.sleep(0.5)
        else:
            print("❌ 登录超时")
            sb.save_screenshot("login_timeout.png")
            send_tg("❌ Pella.app：登录超时")
            return

        inject_ad_hunter(sb)
        time.sleep(1)

        # ── 步骤2：直接导航到服务器页 ────────────────────────
        SERVER_URL = "https://www.pella.app/server/f739a66ec5744742bc4392abda57e7d5"
        print(f"\n── 步骤2：导航到服务器页 ──")
        sb.open(SERVER_URL)
        print(f"📄 已导航至：{SERVER_URL}")

        print("⏳ 等待服务器页加载...")
        for _ in range(20):
            if sb.execute_script("return document.readyState === 'complete';"):
                break
            time.sleep(1)
        time.sleep(2)
        inject_ad_hunter(sb)

        # ── 步骤3：获取 cuty 续期链接 ────────────────────────
        print("\n── 步骤3：获取续期链接 ──")
        print("⏳ 等待续期按钮出现...")
        for _ in range(20):
            if sb.execute_script("return document.querySelector('a[href*=\"cuty.io\"]') !== null;"):
                print("✅ 续期按钮已出现")
                break
            time.sleep(1)
        else:
            print("⚠️ 续期按钮等待超时")
            sb.save_screenshot("renew_btn_wait_timeout.png")

        try:
            sb.wait_for_element_visible('a[href*="cuty.io"]', timeout=15)
            cuty_url = sb.execute_script(
                "return document.querySelector('a[href*=\"cuty.io\"]').href;"
            )
            if not cuty_url:
                raise ValueError("cuty 链接为空")
            print(f"🔗 cuty 链接：{cuty_url}")
        except Exception as e:
            print(f"❌ 找不到续期按钮：{e}")
            sb.save_screenshot("renew_btn_not_found.png")
            send_tg("❌ Pella.app：找不到续期按钮")
            return

        # ── 步骤4：导航到 cuty.io ────────────────────────────
        print("\n── 步骤4：导航到 cuty.io ──")
        sb.open(cuty_url)
        print("⏳ 等待 cuty.io 页面加载...")
        for _ in range(30):
            time.sleep(0.5)
            cur = sb.get_current_url()
            if cur and cur != "about:blank":
                print(f"✅ 页面已加载：{cur}")
                break
        # 注意：cuty.io 有反AdBlock检测，不注入广告猎手
        time.sleep(1)

        # ── 步骤5：点击 Continue ─────────────────────────────
        print("\n── 步骤5：点击 Continue（第一步）──")
        inject_token_listener(sb)

        sb.save_screenshot("cuty_page_loaded.png")
        print("📸 cuty 页面截图已保存")
        btn_info = sb.execute_script("""
            (function(){
                var btns = document.querySelectorAll('button');
                return Array.from(btns).map(function(b){
                    return 'id=' + b.id
                         + ' data-ref=' + (b.getAttribute('data-ref') || '')
                         + ' type=' + b.type
                         + ' text=' + b.innerText.trim().slice(0, 40);
                });
            })()
        """)
        print(f"🔍 页面 button 列表：{btn_info}")

        try:
            sb.wait_for_element_visible(
                'button#submit-button[data-ref="first"]', timeout=20
            )
            sb.execute_script(
                "document.querySelector('button#submit-button[data-ref=\"first\"]').click();"
            )
            print("🖱️ 已点击 Continue（JS直接触发）")
        except Exception as e:
            print(f"❌ 找不到第一个 Continue 按钮：{e}")
            sb.save_screenshot("first_continue_not_found.png")
            send_tg("❌ Pella.app：cuty.io 第一个 Continue 按钮未找到")
            return

        # 等待页面稳定
        time.sleep(3)

        # ── 步骤6：Turnstile 验证 ─────────────────────────────
        print("\n── 步骤6：Turnstile 验证 ──")

        print("⏳ 等待 Turnstile 组件...")
        for _ in range(20):
            if turnstile_exists(sb):
                print("✅ Turnstile 组件就绪")
                break
            time.sleep(1)
        else:
            print("⚠️ Turnstile 未出现，尝试继续...")

        inject_token_listener(sb)
        time.sleep(0.5)

        if turnstile_exists(sb):
            token_ok = False

            for attempt in range(3):
                if attempt > 0:
                    print(f"🔄 Turnstile 第 {attempt+1} 次尝试...")
                    inject_token_listener(sb)

                # JS清遮挡
                sb.execute_script("""
                    (function() {
                        var iframes = document.querySelectorAll('iframe');
                        var tfIframe = null;
                        for (var i = 0; i < iframes.length; i++) {
                            var src = iframes[i].src || '';
                            if (src.includes('cloudflare') || src.includes('turnstile') || src.includes('challenges')) {
                                tfIframe = iframes[i];
                                break;
                            }
                        }
                        if (!tfIframe) return;
                        var rect = tfIframe.getBoundingClientRect();
                        var all = document.querySelectorAll('*');
                        for (var j = 0; j < all.length; j++) {
                            var el = all[j];
                            if (el === tfIframe) continue;
                            var r = el.getBoundingClientRect();
                            var overlap = !(r.right < rect.left || r.left > rect.right ||
                                            r.bottom < rect.top || r.top > rect.bottom);
                            if (!overlap) continue;
                            var style = window.getComputedStyle(el);
                            var z = parseInt(style.zIndex) || 0;
                            if (z > 0 || style.position === 'fixed' || style.position === 'absolute') {
                                el.style.pointerEvents = 'none';
                            }
                        }
                        tfIframe.style.pointerEvents = 'auto';
                        tfIframe.style.zIndex = '999999';
                        tfIframe.style.position = 'relative';
                    })();
                """)
                print("✅ 遮挡层已清除")
                time.sleep(0.5)

                # UC 模式点击
                print("🖱️ 尝试 UC 模式点击 Turnstile...")
                try:
                    sb.uc_gui_click_captcha()
                    print("✅ UC 模式点击完成，等待 token...")
                except Exception as e:
                    print(f"⚠️ UC 模式点击异常：{e}，fallback 到 xdotool...")

                for _ in range(30):
                    time.sleep(0.5)
                    if check_token(sb):
                        token = get_token_value(sb)
                        print(f"✅ Turnstile token 获取成功：{token[:50]}...")
                        token_ok = True
                        break

                if token_ok:
                    break

                print("⚠️ UC 模式未获取到 token，fallback 到 xdotool 坐标点击...")
                inject_token_listener(sb)
                if solve_turnstile(sb):
                    token_ok = True
                    break

                sb.save_screenshot(f"turnstile_attempt_{attempt+1}_fail.png")

            if not token_ok:
                send_tg("❌ Pella.app：Turnstile 验证失败（3次均超时）")
                return

        # ── 步骤7：点击 "I am not a robot" ──────────────────
        print("\n── 步骤7：点击 I am not a robot ──")
        try:
            sb.wait_for_element_visible(
                'button#submit-button[data-ref="captcha"]', timeout=20
            )
            sb.execute_script(
                "document.querySelector('button#submit-button[data-ref=\"captcha\"]').click();"
            )
            print("🖱️ 已点击 I am not a robot（JS直接触发）")
        except Exception as e:
            print(f"❌ 找不到验证按钮：{e}")
            sb.save_screenshot("captcha_btn_not_found.png")
            send_tg("❌ Pella.app：I am not a robot 按钮未找到")
            return

        time.sleep(1)

        # ── 步骤8：等待倒计时归零 ────────────────────────────
        print("\n── 步骤8：等待倒计时 ──")
        last_count = -1
        for _ in range(60):
            time.sleep(0.5)
            try:
                timer_val = sb.execute_script("""
                    (function(){
                        var el = document.getElementById('timer');
                        return el ? parseInt(el.innerText.trim()) : -1;
                    })()
                """)
                if timer_val is None:
                    timer_val = -1
                if timer_val != last_count:
                    if timer_val >= 0:
                        print(f"  ⏱️ 倒计时：{timer_val} 秒")
                    last_count = timer_val
                if timer_val == 0:
                    print("✅ 倒计时归零")
                    break
            except Exception:
                pass
        else:
            print("⚠️ 倒计时等待超时，继续尝试...")

        # ── 步骤9：等待 "Go ->" 按钮可点击 ──────────────────
        print("\n── 步骤9：等待 Go -> 按钮 ──")
        go_btn_ready = False
        for _ in range(60):
            time.sleep(0.5)
            try:
                if sb.execute_script("""
                    (function(){
                        var btn = document.querySelector('button#submit-button[data-ref="show"]');
                        if (!btn) return false;
                        return !btn.disabled && (btn.innerText || '').includes('Go');
                    })()
                """):
                    print("✅ Go -> 按钮已就绪")
                    go_btn_ready = True
                    break
            except Exception:
                pass

        if not go_btn_ready:
            print("⚠️ Go -> 按钮等待超时，尝试直接点击...")

        # ── 步骤10：点击 "Go ->" ─────────────────────────────
        print("\n── 步骤10：点击 Go -> ──")
        try:
            sb.wait_for_element_visible(
                'button#submit-button[data-ref="show"]', timeout=10
            )
            sb.execute_script(
                "document.querySelector('button#submit-button[data-ref=\"show\"]').click();"
            )
            print("🖱️ 已点击 Go ->（JS直接触发）")
        except Exception as e:
            print(f"❌ 点击 Go -> 失败：{e}")
            sb.save_screenshot("go_btn_fail.png")
            send_tg("❌ Pella.app：Go -> 按钮点击失败")
            return

        print("⏳ 等待跳转...")
        time.sleep(3)
        final_url = sb.get_current_url()
        print(f"📄 最终页面：{final_url}")

        # 读取续期结果
        print("⏳ 等待续期结果...")
        renew_result = ""
        for _ in range(20):
            time.sleep(1)
            renew_result = sb.execute_script("""
                (function(){
                    var el = document.querySelector('.text-2xl.font-bold.opacity-50');
                    return el ? el.innerText.trim() : '';
                })()
            """) or ""
            if renew_result:
                print(f"✅ 续期结果：{renew_result}")
                break
        else:
            print("⚠️ 未读取到续期结果文字")

        sb.save_screenshot("renew_success.png")
        print(f"\n✅ 续期流程完成！")
        send_tg(
            f"✅ <b>Pella.app Discord 服务器续期完成</b>\n"
            f"🕐 时间: {now_str()}\n"
            f"📋 结果: {renew_result or '已跳转至续期页'}\n"
            f"🔗 最终页面: {final_url}"
        )


if __name__ == "__main__":
    run()
