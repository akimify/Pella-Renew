# ============================================================
# 广告猎手（常驻 MutationObserver）
# ============================================================
AD_HUNTER_JS = """
(function() {
    if (window.__ad_hunter_injected__) return;
    window.__ad_hunter_injected__ = true;

    var AD_SELECTORS = [
        'iframe[src*="googlesyndication"]',
        'iframe[src*="doubleclick"]',
        'iframe[src*="adnxs"]',
        'iframe[src*="openx"]',
        'iframe[id*="google_ads"]',
        'div[id*="google_ads"]',
        'iframe[id="google_ads_top_frame"]',
        'iframe[id="goog_plcm_frame"]',
        '.adsbygoogle',
        '[data-ad-slot]',
    ];

    var AD_SCRIPT_PATTERNS = [
        'googlesyndication', 'doubleclick', 'adnxs', 'openx',
        'googletag', 'uidapi', 'googletagmanager', 'securepubads',
    ];

    function removeEl(el) {
        try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
    }

    function killAds(root) {
        root = root || document;
        AD_SELECTORS.forEach(function(sel) {
            try { root.querySelectorAll(sel).forEach(removeEl); } catch(e) {}
        });
        try {
            root.querySelectorAll('script[src]').forEach(function(s) {
                if (AD_SCRIPT_PATTERNS.some(function(p){ return (s.src||'').includes(p); })) removeEl(s);
            });
        } catch(e) {}
        try {
            root.querySelectorAll('script:not([src])').forEach(function(s) {
                var t = s.textContent || '';
                if (t.includes('googletag') || t.includes('googlesyndication')) removeEl(s);
            });
        } catch(e) {}
    }

    killAds(document);

    new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
                if (node.nodeType !== 1) return;
                var isAd = AD_SELECTORS.some(function(sel) {
                    try { return node.matches(sel); } catch(e) { return false; }
                });
                if (isAd) { removeEl(node); return; }
                if (node.querySelectorAll) killAds(node);
            });
        });
    }).observe(document.documentElement, { childList: true, subtree: true });

    console.log('[AdHunter] 广告猎手已常驻');
})();
"""

# ============================================================
# Turnstile 通用模块
# ============================================================
EXPAND_POPUP_JS = """
(function() {
    var turnstileInput = document.querySelector('input[name="cf-turnstile-response"]');
    if (!turnstileInput) return;
    var el = turnstileInput;
    for (var i = 0; i < 20; i++) {
        el = el.parentElement;
        if (!el) break;
        var style = window.getComputedStyle(el);
        if (style.overflow === 'hidden' || style.overflowX === 'hidden' || style.overflowY === 'hidden') {
            el.style.overflow = 'visible';
        }
        el.style.minWidth = 'max-content';
    }
})();
"""

INJECT_TOKEN_LISTENER_JS = """
(function() {
    if (window.__cf_token_listener_injected__) return;
    window.__cf_token_listener_injected__ = true;
    window.__cf_turnstile_token__ = '';

    window.addEventListener('message', function(e) {
        try {
            var d = e.data;
            if (!d || typeof d !== 'object') return;
            if (d.event === 'food') return;
            var token = d.token || d.response;
            if (token && token.length > 20) {
                window.__cf_turnstile_token__ = token;
                var inputs = document.querySelectorAll(
                    'input[name="cf-turnstile-response"], input[name="cf_turnstile_response"]'
                );
                for (var i = 0; i < inputs.length; i++) {
                    try {
                        var nativeSet = Object.getOwnPropertyDescriptor(
                            HTMLInputElement.prototype, 'value'
                        ).set;
                        nativeSet.call(inputs[i], token);
                        inputs[i].dispatchEvent(new Event('input',  {bubbles: true}));
                        inputs[i].dispatchEvent(new Event('change', {bubbles: true}));
                    } catch(err) {
                        inputs[i].value = token;
                    }
                }
            }
        } catch(err) {}
    });
})();
"""

READ_CAPTURED_TOKEN_JS = """
(function(){
    return window.__cf_turnstile_token__ || '';
})()
"""


def xdotool_click(x, y):
    """连续点击3次，间隔1秒，模拟多次真实点击"""
    x, y = int(x), int(y)
    success = False
    for i in range(3):
        try:
            subprocess.run(
                ["xdotool", "mousemove", str(x), str(y), "click", "1"],
                check=True, capture_output=True
            )
            print(f"📐 坐标点击成功（第{i+1}次）")
            success = True
        except subprocess.CalledProcessError as e:
            print(f"⚠️ xdotool执行异常（第{i+1}次）: {e.stderr.decode().strip()}")
        except Exception as e:
            print(f"⚠️ xdotool执行异常（第{i+1}次）: {e}")
        if i < 2:
            time.sleep(1)
    return success


def get_turnstile_metrics(sb):
    for _ in range(10):
        metrics = sb.execute_script("""
            (function() {
                var anchor = document.querySelector('input[name="cf-turnstile-response"]');
                if (!anchor) return null;
                var rect = anchor.parentElement.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return 'waiting';
                var viewportX = rect.left + (rect.width / 2) - 130;
                var viewportY = rect.top + (rect.height / 2);
                var iframes = document.querySelectorAll('iframe');
                for (var i = 0; i < iframes.length; i++) {
                    var src = iframes[i].src || '';
                    if (src.includes('cloudflare') || src.includes('turnstile')) {
                        var fr = iframes[i].getBoundingClientRect();
                        if (fr.width > 0 && fr.height > 0) {
                            viewportX = fr.left + 30;
                            viewportY = fr.top + fr.height / 2;
                            break;
                        }
                    }
                }
                return {
                    viewport_x: Math.round(viewportX),
                    viewport_y: Math.round(viewportY),
                    win_x:    window.screenX || 0,
                    win_y:    window.screenY || 0,
                    outer_h:  window.outerHeight,
                    inner_h:  window.innerHeight,
                    outer_w:  window.outerWidth,
                    inner_w:  window.innerWidth
                };
            })()
        """)
        if metrics != 'waiting':
            return metrics
        time.sleep(1)
    return None


def check_token(sb) -> bool:
    try:
        if sb.execute_script("""
            (function(){
                var input = document.querySelector('input[name="cf-turnstile-response"]');
                return input && input.value && input.value.length > 20;
            })()
        """):
            return True
    except Exception:
        pass
    try:
        token = sb.execute_script(READ_CAPTURED_TOKEN_JS)
        if token and len(token) > 20:
            return True
    except Exception:
        pass
    return False


def get_token_value(sb) -> str:
    try:
        token = sb.execute_script(READ_CAPTURED_TOKEN_JS)
        if token and len(token) > 20:
            return token
    except Exception:
        pass
    try:
        token = sb.execute_script("""
            (function(){
                var input = document.querySelector('input[name="cf-turnstile-response"]');
                return (input && input.value) ? input.value : '';
            })()
        """)
        if token and len(token) > 20:
            return token
    except Exception:
        pass
    return ''


def turnstile_exists(sb) -> bool:
    try:
        return sb.execute_script(
            "(function(){ return document.querySelector('input[name=\"cf-turnstile-response\"]') !== null; })()"
        )
    except Exception:
        return False


def inject_token_listener(sb):
    try:
        sb.execute_script(INJECT_TOKEN_LISTENER_JS)
        print("📡 开始监控Cloudflare Turnstile Token...")
    except Exception as e:
        print(f"⚠️ 监听器注入失败：{e}")


def solve_turnstile(sb) -> bool:
    for _ in range(3):
        sb.execute_script(EXPAND_POPUP_JS)
        time.sleep(0.5)

    if check_token(sb):
        print("✅ 验证已自动通过")
        return True

    sb.execute_script("""
        var anchor = document.querySelector('input[name="cf-turnstile-response"]');
        if (anchor && anchor.parentElement) {
            anchor.parentElement.scrollIntoView({behavior:'smooth', block:'center'});
        }
    """)
    time.sleep(1.5)

    metrics = get_turnstile_metrics(sb)
    if metrics is None:
        print("❌ 验证坐标获取失败")
        sb.save_screenshot("turnstile_no_coords.png")
        return False

    vp_x        = metrics['viewport_x']
    vp_y        = metrics['viewport_y']
    win_x       = metrics['win_x']
    win_y       = metrics['win_y']
    toolbar_h   = metrics['outer_h'] - metrics['inner_h']
    border_left = (metrics['outer_w'] - metrics['inner_w']) / 2 \
                  if metrics['outer_w'] > metrics['inner_w'] else 0
    abs_x = int(vp_x + win_x + border_left)
    abs_y = int(vp_y + win_y + toolbar_h)
    print("📐 坐标计算完成")

    try:
        sb.execute_script(f"""
            (function(){{
                var dot = document.getElementById('sniper-dot') || document.createElement('div');
                dot.id = 'sniper-dot';
                dot.style.position = 'fixed';
                dot.style.left = '{vp_x - 5}px';
                dot.style.top = '{vp_y - 5}px';
                dot.style.width = '10px';
                dot.style.height = '10px';
                dot.style.backgroundColor = 'red';
                dot.style.borderRadius = '50%';
                dot.style.zIndex = '99999999';
                dot.style.pointerEvents = 'none';
                dot.style.boxShadow = '0 0 5px rgba(255,0,0,0.8)';
                if (!document.getElementById('sniper-dot')) document.body.appendChild(dot);
            }})();
        """)
    except Exception as e:
        print(f"⚠️ 红点注入失败：{e}")

    sb.save_screenshot("turnstile_click_pos.png")
    print("📸 点击位置截图已保存")

    # 3连击（间隔1秒），检测到token立即返回
    xdotool_click(abs_x, abs_y)

    for _ in range(30):
        time.sleep(0.5)
        if check_token(sb):
            token = get_token_value(sb)
            print(f"✅ Cloudflare Turnstile 验证通过！token：{token[:50]}...")
            return True

    print("❌ 人机验证超时")
    sb.save_screenshot("turnstile_fail.png")
    return False


